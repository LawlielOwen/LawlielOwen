<svg width="700" height="170" viewBox="0 0 700 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner decorativo con atardecer sobre colinas">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241638"/>
      <stop offset="38%" stop-color="#5b3a72"/>
      <stop offset="68%" stop-color="#c46f5a"/>
      <stop offset="100%" stop-color="#f2b76b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf3d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fdf3d8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundedFrame">
      <rect x="0" y="0" width="700" height="170" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <rect x="0" y="0" width="700" height="170" fill="url(#sky)"/>

    <!-- estrellas dispersas -->
    <g fill="#fdf3d8">
      <circle cx="60" cy="24" r="1.3" opacity="0.7"/>
      <circle cx="120" cy="45" r="1" opacity="0.5"/>
      <circle cx="200" cy="20" r="1.4" opacity="0.6"/>
      <circle cx="260" cy="55" r="1" opacity="0.4"/>
      <circle cx="330" cy="18" r="1.2" opacity="0.6"/>
      <circle cx="40" cy="70" r="1" opacity="0.4"/>
    </g>

    <!-- luna con resplandor suave -->
    <circle cx="565" cy="46" r="42" fill="url(#moonGlow)"/>
    <circle cx="565" cy="46" r="22" fill="#fdf3d8"/>
    <circle cx="574" cy="40" r="20" fill="#5b3a72" opacity="0.92"/>

    <!-- luciernagas / petalos flotando -->
    <g fill="#ffe3b0">
      <circle cx="150" cy="90" r="2.4" opacity="0.75"/>
      <circle cx="420" cy="60" r="2" opacity="0.6"/>
      <circle cx="480" cy="100" r="2.2" opacity="0.7"/>
      <circle cx="230" cy="110" r="1.8" opacity="0.55"/>
      <circle cx="640" cy="90" r="2" opacity="0.6"/>
    </g>

    <!-- colinas, capa lejana -->
    <path d="M0,170 L0,120 Q90,95 180,115 T360,110 T540,118 T700,105 L700,170 Z"
          fill="#1f1436" opacity="0.85"/>

    <!-- colinas, capa cercana -->
    <path d="M0,170 L0,140 Q120,110 260,132 T520,128 T700,138 L700,170 Z"
          fill="#150c26"/>

    <!-- silueta de techos, evocando un pueblo tranquilo -->
    <g fill="#0f0a1c">
      <path d="M110,170 L110,148 L128,134 L146,148 L146,170 Z"/>
      <path d="M150,170 L150,155 L163,144 L176,155 L176,170 Z"/>
      <path d="M560,170 L560,150 L580,136 L600,150 L600,170 Z"/>
      <path d="M604,170 L604,158 L616,148 L628,158 L628,170 Z"/>
    </g>
  </g>
</svg>
